# Aggregate state machine (proposal 0001) with a FEEL guard (proposal 0002).
# Sidecar so `esdm lint` (core only) ignores it; the generator reads it and the
# FEEL gate validates the `when:` expression against the quote's state fields.
apiVersion: schema.esdm.io/state-machine/v1
kind: state-machine
name: quote-lifecycle
scope:
  domain: manufacturing
  boundedContext: quoting
  aggregate: quote
initial: drafted
states:
  - { name: drafted }
  - { name: sent }
  - { name: accepted, final: true }
  - { name: rejected, final: true }
transitions:                 # evolve
  - { on: quote-drafted, to: drafted }
  - { on: quote-sent, to: sent }
  - { on: quote-accepted, to: accepted }
  - { on: quote-rejected, to: rejected }
admits:                      # decide (state) + FEEL guard (data/temporal)
  - { command: price-quote, from: [drafted, sent] }
  # `starts with` and `contains` exercise call arguments; Q1's product is "flux capacitor"
  # and Q2's is "compiler", so only the then-branch of the guard above can admit both.
  - { command: send-quote, from: [drafted], when: 'contains(product, "c")' }
  # The arithmetic half is the conformance suite's only exercise of `*` (0002 amendment).
  # Q1 is 4200 x 3 = 12600 and passes; a compiler that read `*` as +, - or / would yield
  # 4203, 4197 or 1400, all below the threshold, and flip an observable outcome.
  # Arithmetic and a conditional, both exercised by the conformance suite (0002 amendment,
  # 2026-08-14). Q1 has quantity 3, so the THEN branch decides it: 4200 x 3 = 12600 passes.
  # A generator that always took the else branch would answer 4200 >= 99999 and reject Q1,
  # which the golden would catch.
  - { command: accept-quote, from: [sent], when: 'validUntil >= today() and count(tags) >= 1 and (if quantity > 1 then amount * quantity >= 5000 else amount >= 99999)' }
  - { command: reject-quote, from: [sent] }
